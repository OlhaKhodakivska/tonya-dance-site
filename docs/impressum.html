<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impressum | Tonya Musemotion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { brand: "#FF4500" },
            fontFamily: { sans: ["Montserrat", "sans-serif"] },
          },
        },
      };
    </script>
  </head>

  <body class="bg-black text-white font-sans antialiased">
    <div class="max-w-3xl mx-auto px-6 py-12 md:py-20">
      <a
        href="./index.html"
        class="group text-brand font-bold uppercase text-xs tracking-widest flex items-center mb-12 hover:text-white transition"
      >
        <span
          class="mr-2 transform group-hover:-translate-x-2 transition-transform"
          >⟵</span
        >
        Back to Home
      </a>

      <h1
        class="text-4xl md:text-5xl font-black uppercase mb-12 italic tracking-tighter"
      >
        Impres<span class="text-brand">sum</span>
      </h1>

      <div class="space-y-8 text-zinc-400 leading-relaxed">
        <div>
          <h2
            class="text-white uppercase font-bold text-sm tracking-widest mb-4 border-b border-brand/30 pb-2"
          >
            Angaben gemäß § 5 TMG
          </h2>
          <p class="text-lg">
            Tonya Musemotion<br />Musterstraße 1<br />12345 Berlin
          </p>
        </div>

        <div>
          <h2
            class="text-white uppercase font-bold text-sm tracking-widest mb-4 border-b border-brand/30 pb-2"
          >
            Kontakt
          </h2>
          <p>
            E-Mail:
            <a
              href="mailto:tonya@example.com"
              class="text-brand hover:underline"
              >tonya@example.com</a
            >
          </p>
        </div>
      </div>

      <footer
        class="mt-20 pt-8 border-t border-white/10 text-[10px] text-zinc-600 uppercase tracking-widest italic"
      >
        Stand: <span id="currentYear"></span>. Dieses Dokument dient als
        Platzhalter.
      </footer>
    </div>

    <script>
      document.getElementById("currentYear").textContent =
        new Date().getFullYear();
    </script>
  </body>
</html>
